name: Build and Deploy to Docker Hub

on:
  push:
    branches:
      - main # Changed from master to match your repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repo
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3 # Recommended for modern, faster builds

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.user
        push: true
        # Dynamically uses your Docker username and names the image 'wallet-user-app'
        tags: ${{ secrets.DOCKER_USERNAME }}/wallet:latest  
        
        # Next.js needs these environment variables DURING the container build
        build-args: |
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_ID=${{ secrets.GOOGLE_ID }}
          GOOGLE_SECRET=${{ secrets.GOOGLE_SECRET }}

    - name: Verify Pushed Image
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/wallet:latest